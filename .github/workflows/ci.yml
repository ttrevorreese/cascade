name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Report failing tests as annotations
        if: failure()
        # Annotations are readable without signing in, unlike raw job logs.
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            python3 - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for problem in list(case.iter("failure")) + list(case.iter("error")):
                  text = (problem.get("message") or problem.text or "").strip().replace("\n", " ")[:900]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          EOF
          done
      - name: Lint
        run: ./gradlew lintDebug
      - name: Build debug APK and instrumented tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/
